name: application-checks
on:
  push:
    paths: ["inbox.py", "tests/**", "requirements.txt", "schema.sql", "web/**", ".github/workflows/checks.yml"]
  pull_request:
    paths: ["inbox.py", "tests/**", "requirements.txt", "schema.sql", "web/**", ".github/workflows/checks.yml"]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build -- --webpack
        working-directory: web
        env:
          DATABASE_URL: postgresql://test:test@example.com/test?sslmode=require
