name: application-checks
on:
  push:
    paths: ["opportunities.csv", "web/**", ".github/workflows/checks.yml"]
  pull_request:
    paths: ["opportunities.csv", "web/**", ".github/workflows/checks.yml"]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
