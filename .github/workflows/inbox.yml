name: opportunity-inbox
on:
  schedule:
    - cron: "30 0 * * *"  # daily 06:00 IST; GitHub may start it late, inbox.py widens the search window to cover that
  workflow_dispatch:
permissions:
  contents: write  # to commit state.json back
concurrency: inbox  # queue runs so two never push at once
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify scanner before making paid requests
        run: python -m unittest discover -s tests -v
      - run: python inbox.py
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REDDIT_ENABLED: ${{ vars.REDDIT_ENABLED || 'true' }}
      - name: Save seen posts
        if: always()  # inbox.py saves seen posts even when some failed
        run: |
          git config user.name "opportunity-inbox"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "inbox: update seen posts" && git push)
