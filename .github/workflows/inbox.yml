name: opportunity-inbox
on:
  # Paused until go-live (add repo secrets, remove the Mac cron), then uncomment:
  # schedule:
  #   - cron: "0 * * * *"  # hourly; GitHub may start it 5-30 min late, still inside the 2h target
  workflow_dispatch:
permissions:
  contents: write  # to commit state.json back
concurrency: inbox  # queue runs so two never push at once
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python inbox.py
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      - name: Save seen posts
        run: |
          git config user.name "opportunity-inbox"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "inbox: update seen posts" && git push)
